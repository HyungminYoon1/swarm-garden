<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="description" content="모이고, 정렬하고, 흩어지는 군집의 움직임을 직접 조절하는 Boids 실험 정원." /><meta name="theme-color" content="#071522" /><meta name="referrer" content="no-referrer" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071522'/%3E%3Cpath d='m5 9 9 4-9 4zm10 7 12 4-12 5zm0-13 12 4-12 4z' fill='%235ce4dd'/%3E%3C/svg%3E" /><link rel="stylesheet" href="styles.css" /><script type="module" src="src/app.js"></script><title>SWARM GARDEN — 군집 정원</title></head><body>
<header><a class="logo" href="./"><span>⋰</span>SWARM GARDEN</a><nav><a href="https://hyungminyoon1.github.io/web-lab/">WEB LAB</a><a href="https://github.com/HyungminYoon1/swarm-garden" target="_blank" rel="noopener noreferrer">코드</a></nav></header>
<main><div class="top"><div><p class="eyebrow">A GARDEN OF LOCAL RULES</p><h1>작은 규칙으로, 함께 움직이기.</h1></div><div class="actions"><button id="play">일시정지</button><button id="reset">새 무리</button></div></div>
<div class="garden"><section class="field" aria-label="군집 움직임"><canvas id="field" width="960" height="600" tabindex="0" aria-label="군집 시뮬레이션. 장애물 모드에서 클릭하면 장애물을 놓습니다. 방향키로 유도점을 이동하고 Enter로 장애물을 놓을 수 있습니다."></canvas><div class="field-hud"><span id="count"></span><span id="seed"></span><span id="mode-label"></span></div><p class="field-note">화면을 만져 무리를 유도하거나, 장애물을 놓아보세요.</p></section>
<aside><div class="preset-row"><button data-preset="school">물결</button><button data-preset="flock">정렬</button><button data-preset="scatter">흩어짐</button></div>
<h2>무리의 규칙</h2><label>개체 수 <output id="size-out"></output><input id="size" type="range" min="40" max="280" step="20" value="160" /></label><label>서로 떨어지기 <output id="separation-out"></output><input id="separation" type="range" min="0" max="3" step="0.1" value="1.5" /></label><label>방향 맞추기 <output id="alignment-out"></output><input id="alignment" type="range" min="0" max="3" step="0.1" value="1.1" /></label><label>가운데 모이기 <output id="cohesion-out"></output><input id="cohesion" type="range" min="0" max="3" step="0.1" value="0.8" /></label><label>이웃을 보는 거리 <output id="vision-out"></output><input id="vision" type="range" min="30" max="130" step="5" value="75" /></label>
<h2>정원에 손대기</h2><div class="mode-row"><button data-mode="guide" aria-pressed="true">모으기</button><button data-mode="avoid" aria-pressed="false">피하기</button><button data-mode="obstacle" aria-pressed="false">장애물</button></div><button id="clear" class="wide">장애물 지우기</button><label class="check"><input id="trail" type="checkbox" checked /> 이동 흔적 보이기</label><p class="feedback" id="feedback" role="status">무리는 가까운 이웃의 위치와 방향에만 반응합니다.</p>
</aside></div><div class="metrics"><div><span>정렬도</span><strong id="order">0%</strong></div><div><span>평균 움직임</span><strong id="speed">0</strong></div><div><span>장애물</span><strong id="obstacles">0 / 12</strong></div><p>개체 하나의 규칙을 바꾸면<br />무리 전체의 모양이 달라집니다.</p></div><footer><span>SWARM GARDEN / BOIDS PLAYGROUND</span><a href="https://www.red3d.com/cwr/boids/" target="_blank" rel="noopener noreferrer">Craig Reynolds의 Boids 모델 읽기</a></footer></main></body></html>
